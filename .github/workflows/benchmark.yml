name: CodSpeed

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: scripts/install
        shell: bash

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5.6.0
        with:
          mode: instrumentation
          run: uv run pytest tests/test_benchmark.py --codspeed

  memory-benchmarks:
    name: Run memory benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: scripts/install
        shell: bash

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5.6.0
        with:
          mode: memory
          run: uv run pytest tests/test_benchmark_memory.py --codspeed
